<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍳 Dish Dash</h1>

<h2>Every Ingredient Has a Story.</h2>

<p>Welcome to Dish Dash, Chef! 👩‍🍳💗</p>

<p>Let's make something delicious today.</p>

<button onclick="window.location.href='home.html'">
Start Cooking
</button>

  <script src="script.js"></script>

</body>
</html>
<input id="ingredients" placeholder="Enter ingredients (example: egg, bread)">
<button onclick="findRecipe()">Find Recipe 🍽️</button>

<div id="results"></div>

<script>
const recipes = [
{
name: "Egg Sandwich",
ingredients: ["egg", "bread"],
steps: "Cook egg and place it between bread."
},
{
name: "Cheese Toast",
ingredients: ["bread", "cheese"],
steps: "Add cheese to bread and toast until melted."
},
{
name: "Pasta",
ingredients: ["pasta", "tomato"],
steps: "Cook pasta and add tomato sauce."
}
];

function findRecipe(){
let input = document.getElementById("ingredients").value.toLowerCase();
let results = document.getElementById("results");

let found = recipes.filter(recipe =>
recipe.ingredients.some(item => input.includes(item))
);

if(found.length === 0){
results.innerHTML = "😢 No recipes found";
} else {
results.innerHTML = found.map(recipe =>
`<h2>${recipe.name}</h2>
<p>${recipe.steps}</p>`
).join("");
}
}
</script>
